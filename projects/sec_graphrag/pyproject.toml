[project]
name = "sec-graphrag"
version = "0.1.0"
description = "GraphRAG Q&A over semiconductor 10-K filings with LangChain, LangGraph and LangSmith"
readme = "README.md"
authors = [
    { email = "giorgi.bibilashvili89@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "edgartools>=5.60.0",
    "langchain-neo4j>=0.10.0",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.13",
    "langsmith>=0.14.4",
    "neo4j>=6.3.1",
    "pydantic-settings>=2.15.0",
    "tiktoken>=0.14.0",
    "typer>=0.27.2",
]

[project.scripts]
sec-graphrag = "sec_graphrag.cli:app"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
# Our package lives in src/; lets ruff classify `sec_graphrag` imports as first-party.
src = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
