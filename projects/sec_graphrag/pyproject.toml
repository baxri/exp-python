[project]
name = "sec-graphrag"
version = "0.1.0"
description = "GraphRAG Q&A over semiconductor 10-K filings with LangChain, LangGraph and LangSmith"
readme = "README.md"
authors = [
    { email = "giorgi.bibilashvili89@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "neo4j>=6.3.1",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
]

[project.scripts]
sec-graphrag = "sec_graphrag.cli:app"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
# Our package lives in src/; lets ruff classify `sec_graphrag` imports as first-party.
src = ["src"]
