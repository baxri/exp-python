[project]
name = "exp-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.14",
    "cohere>=7.3.0",
    "neo4j>=6.3.1",
    "neo4j-graphrag[openai]>=1.21.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["RAG"]

[tool.uv.workspace]
members = [
    "projects/sec_graphrag",
]
